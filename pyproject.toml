[project]
name = "rag-support"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg>=3.2,<4", "pydantic-settings>=2.5,<3", "httpx>=0.27,<1", "pypdf>=5,<7", "python-docx>=1.1,<2", "beautifulsoup4>=4.12,<5", "python-multipart>=0.0.9,<1", "PyJWT[crypto]>=2.9,<3", "cryptography>=45,<46"]

[project.optional-dependencies]
local = ["sentence-transformers>=3,<6"]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "pillow>=10.1,<13", "fpdf2>=2.7,<3"]

[project.scripts]
rag-evaluate = "rag_support.evaluate:main"
rag-reindex = "rag_support.reindex:main"
rag-purge = "rag_support.purge:main"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
markers = ["integration: needs TEST_DATABASE_URL pointing at PostgreSQL with pgvector"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
